<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Music</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      overflow-x: hidden;
      position: relative;
    }

    /* Landing Screen Interface */
    #landingScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      /* Background Image for Landing Screen */
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), url('landing-bg.jpg') center/cover no-repeat;
      background-color: #171522; /* Fallback color */
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #landingScreen h1 {
      font-size: 34px;
      margin-bottom: 12px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #landingScreen p {
      font-size: 16px;
      color: #e2d9eb;
      margin-bottom: 35px;
      max-width: 320px;
      line-height: 1.4;
    }

    .enter-btn {
      background: linear-gradient(135deg, #d29bc8, #8e6bb3);
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(210, 155, 200, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .enter-btn:active {
      transform: scale(0.96);
    }

    /* Main App Interface */
    .app-wrapper {
      min-height: 100vh;
      /* Background Image for Player Screen */
      background: linear-gradient(160deg, rgba(23, 21, 34, 0.85), rgba(48, 38, 61, 0.9)), url('player-bg.jpg') center/cover no-repeat;
      background-color: #171522; /* Fallback color */
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      z-index: 2;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 7px;
    }

    .header p {
      color: #c7bdcf;
      font-size: 14px;
    }

    .player {
      background: rgba(255,255,255,0.08);
      border-radius: 25px;
      padding: 22px;
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      margin-bottom: 22px;
    }

    .cover-container {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 20px;
      margin-bottom: 20px;
      overflow: hidden;
      background: linear-gradient(135deg, #8e6bb3, #d69bb8);
    }

    .cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .song-info {
      text-align: center;
      margin-bottom: 18px;
    }

    .song-info h2 {
      font-size: 21px;
      margin-bottom: 5px;
    }

    .song-info p {
      color: #c7bdcf;
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #d7a8d8;
      cursor: pointer;
    }

    .time {
      display: flex;
      justify-content: space-between;
      color: #bdb3c5;
      font-size: 12px;
      margin-top: 5px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 20px;
    }

    .controls button {
      border: none;
      color: white;
      background: rgba(255,255,255,0.1);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 19px;
      cursor: pointer;
    }

    .controls .play {
      width: 62px;
      height: 62px;
      font-size: 25px;
      background: #d29bc8;
      color: #211a28;
    }

    .songs {
      background: rgba(255,255,255,0.06);
      border-radius: 22px;
      padding: 15px;
    }

    .songs h3 {
      margin: 5px 8px 14px;
      font-size: 18px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 10px;
      border-radius: 15px;
      cursor: pointer;
    }

    .song:hover {
      background: rgba(255,255,255,0.08);
    }

    .song-number {
      width: 30px;
      text-align: center;
      color: #bdb3c5;
    }

    .song-details {
      flex: 1;
    }

    .song-details strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .song-details span {
      color: #aaa0b3;
      font-size: 12px;
    }

    .volume {
      margin-top: 18px;
    }

    .volume label {
      color: #bdb3c5;
      font-size: 12px;
    }

    /* Floating Emoji Animation */
    .floating-emoji {
      position: fixed;
      bottom: -50px;
      font-size: 28px;
      pointer-events: none;
      z-index: 1000;
      animation: floatUp 3s linear forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Landing Interface -->
  <div id="landingScreen">
    <h1>Our Special Place ♡</h1>
    <p>A little album of music and memories created just for you.</p>
    <button class="enter-btn" onclick="enterAlbum()">Enter into precious album</button>
  </div>

  <!-- Music Player Interface -->
  <div class="app-wrapper">
    <div class="app">

      <div class="header">
        <h1>Our Music ♡</h1>
        <p>A little place for our songs</p>
      </div>

      <div class="player">

        <div class="cover-container">
          <img id="coverImage" class="cover" src="cover1.jpg" alt="Song Cover">
        </div>

        <div class="song-info">
          <h2 id="title">Our First Song</h2>
          <p id="artist">Our Playlist</p>
        </div>

        <input type="range" id="progress" value="0" min="0" max="100">

        <div class="time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>

        <div class="controls">
          <button onclick="previousSong()">↶</button>
          <button class="play" onclick="togglePlay()" id="playButton">▶</button>
          <button onclick="nextSong()">↷</button>
        </div>

        <div class="volume">
          <label>Volume</label>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </div>

      </div>

      <div class="songs">
        <h3>Our Songs</h3>

        <div class="song" onclick="selectSong(0)">
          <div class="song-number">01</div>
          <div class="song-details">
            <strong>Our First Song</strong>
            <span>Tap to play</span>
          </div>
        </div>

        <div class="song" onclick="selectSong(1)">
          <div class="song-number">02</div>
          <div class="song-details">
            <strong>Our Second Song</strong>
            <span>Tap to play</span>
          </div>
        </div>

        <div class="song" onclick="selectSong(2)">
          <div class="song-number">03</div>
          <div class="song-details">
            <strong>Our Third Song</strong>
            <span>Tap to play</span>
          </div>
        </div>

      </div>

    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    const songs = [
      {
        title: "chaar kadam ft.altu💞",
        artist: "Our Playlist",
        file: "song1.mp3",
        cover: "cover1.jpg"
      },
      {
        title: "dil haareya ft.altu💗",
        artist: "Our Playlist",
        file: "song2.mp3",
        cover: "cover2.jpg"
      },
      {
        title: "Our Third Song",
        artist: "Our Playlist",
        file: "song3.mp3",
        cover: "cover3.jpg"
      }
    ];

    let currentSong = 0;

    const audio = document.getElementById("audio");
    const title = document.getElementById("title");
    const artist = document.getElementById("artist");
    const playButton = document.getElementById("playButton");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");
    const coverImage = document.getElementById("coverImage");
    const landingScreen = document.getElementById("landingScreen");

    const emojiList = ["💖", "✨", "🌸", "💕", "🎶", "🥰", "💌", "⭐"];

    function triggerEmojiBurst() {
      for (let i = 0; i < 15; i++) {
        setTimeout(() => {
          const emoji = document.createElement("div");
          emoji.className = "floating-emoji";
          emoji.textContent = emojiList[Math.floor(Math.random() * emojiList.length)];
          emoji.style.left = Math.random() * 90 + 5 + "vw";
          emoji.style.animationDuration = (Math.random() * 2 + 2) + "s";
          document.body.appendChild(emoji);

          setTimeout(() => emoji.remove(), 4000);
        }, i * 120);
      }
    }

    function enterAlbum() {
      // Hide Landing Screen
      landingScreen.style.opacity = "0";
      landingScreen.style.visibility = "hidden";

      // Start Playing Music Directly
      loadSong(0);
      audio.play().then(() => {
        playButton.textContent = "Ⅱ";
      }).catch(e => console.log("Autoplay prevention:", e));

      triggerEmojiBurst();
    }

    function loadSong(index) {
      currentSong = index;

      title.textContent = songs[index].title;
      artist.textContent = songs[index].artist;
      coverImage.src = songs[index].cover;

      audio.src = songs[index].file;
      progress.value = 0;
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playButton.textContent = "Ⅱ";
        triggerEmojiBurst();
      } else {
        audio.pause();
        playButton.textContent = "▶";
      }
    }

    function selectSong(index) {
      loadSong(index);
      audio.play();
      playButton.textContent = "Ⅱ";
      triggerEmojiBurst();
    }

    function nextSong() {
      currentSong++;
      if (currentSong >= songs.length) {
        currentSong = 0;
      }
      loadSong(currentSong);
      audio.play();
      playButton.textContent = "Ⅱ";
      triggerEmojiBurst();
    }

    function previousSong() {
      currentSong--;
      if (currentSong < 0) {
        currentSong = songs.length - 1;
      }
      loadSong(currentSong);
      audio.play();
      playButton.textContent = "Ⅱ";
      triggerEmojiBurst();
    }

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        progress.value = (audio.currentTime / audio.duration) * 100;
      }
      currentTime.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });

    progress.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime = (progress.value / 100) * audio.duration;
      }
    });

    volume.addEventListener("input", () => {
      audio.volume = volume.value;
    });

    // Plays continuous music automatically
    audio.addEventListener("ended", () => {
      nextSong();
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      let minutes = Math.floor(seconds / 60);
      let secs = Math.floor(seconds % 60);
      if (secs < 10) secs = "0" + secs;
      return minutes + ":" + secs;
    }

    loadSong(0);
  </script>

</body>
</html>
